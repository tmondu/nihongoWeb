<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <filter id="sakuraGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#7a1c3d" flood-opacity="0.3"/>
    </filter>
    <radialGradient id="flowerGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8fa"/>
      <stop offset="45%" stop-color="#ffafcc"/>
      <stop offset="85%" stop-color="#f72585"/>
      <stop offset="100%" stop-color="#b5179e"/>
    </radialGradient>
    <!-- Cánh hoa đơn lẻ có khía chữ V đặc trưng của hoa anh đào -->
    <path id="petal" d="M 0,0 
                        C -3.8,-3.5 -5,-8.5 -2.5,-12.5 
                        C -1.5,-14 0,-13.2 0,-11.5 
                        C 0,-13.2 1.5,-14 2.5,-12.5 
                        C 5,-8.5 3.8,-3.5 0,0 Z" 
          fill="url(#flowerGrad)" 
          stroke="#9f1239" 
          stroke-width="0.75"/>
  </defs>

  <g filter="url(#sakuraGlow)">
    <!-- Tâm hoa xoay quanh tọa độ (12, 14) để cánh trên nhô ra đỉnh click chính xác -->
    <g transform="translate(13, 15)">
      <!-- 5 Cánh hoa sakura xoay đều 72 độ -->
      <use href="#petal" transform="rotate(0)"/>
      <use href="#petal" transform="rotate(72)"/>
      <use href="#petal" transform="rotate(144)"/>
      <use href="#petal" transform="rotate(216)"/>
      <use href="#petal" transform="rotate(288)"/>

      <!-- Nhụy hoa (stamens) vàng tươi ở giữa -->
      <circle cx="0" cy="0" r="3" fill="#ffe4e6"/>
      <circle cx="0" cy="0" r="1.6" fill="#f43f5e"/>
      <circle cx="-1.2" cy="-1.5" r="0.8" fill="#fbbf24"/>
      <circle cx="1.5" cy="-1.2" r="0.8" fill="#fbbf24"/>
      <circle cx="-1.5" cy="1.2" r="0.8" fill="#fbbf24"/>
      <circle cx="1.2" cy="1.5" r="0.8" fill="#fbbf24"/>
      <circle cx="0" cy="-2" r="0.7" fill="#fbbf24"/>
    </g>

    <!-- Điểm nhọn chỉ hướng click ở đầu cánh trên -->
    <polygon points="13,0 15,4 11,4" fill="#fb7185" stroke="#9f1239" stroke-width="0.6"/>
  </g>
</svg>