<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0.8" dy="1" stdDeviation="0.6" flood-color="#5a1827" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#be185d"/>
      <stop offset="50%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>
  </defs>

  <g filter="url(#textGlow)">
    <!-- Thanh I-beam thiết kế cành đào cách điệu -->
    <!-- Thanh ngang trên -->
    <path d="M 8,4 C 11,5 15,3 20,4 C 20,5.5 19,6 17,6 L 11,6 C 9,6 8,5 8,4 Z" fill="#9d174d"/>
    <!-- Thanh ngang dưới -->
    <path d="M 8,28 C 11,27 15,29 20,28 C 20,26.5 19,26 17,26 L 11,26 C 9,26 8,27 8,28 Z" fill="#9d174d"/>
    
    <!-- Cột dọc giữa -->
    <rect x="13.2" y="5" width="2" height="22" rx="1" fill="url(#stemGrad)"/>

    <!-- Bông hoa anh đào nhỏ nở ngay giữa thanh I-beam -->
    <g transform="translate(14.2, 16) scale(0.6)">
      <path d="M 0,-8 C 2,-5 5,-5 7,-3 C 5,-1 5,2 3,5 C 1,3 -2,4 -4,2 C -3,-1 -4,-4 -1,-6 Z" fill="#ffb7cf" stroke="#9d174d" stroke-width="0.8"/>
      <!-- 5 cánh hoa sakura nhỏ xinh -->
      <circle cx="0" cy="-4" r="2.2" fill="#fff0f5" stroke="#db2777" stroke-width="0.6"/>
      <circle cx="3.8" cy="-1.2" r="2.2" fill="#fff0f5" stroke="#db2777" stroke-width="0.6"/>
      <circle cx="2.4" cy="3.2" r="2.2" fill="#fff0f5" stroke="#db2777" stroke-width="0.6"/>
      <circle cx="-2.4" cy="3.2" r="2.2" fill="#fff0f5" stroke="#db2777" stroke-width="0.6"/>
      <circle cx="-3.8" cy="-1.2" r="2.2" fill="#fff0f5" stroke="#db2777" stroke-width="0.6"/>
      <circle cx="0" cy="0" r="1.5" fill="#fbbf24"/>
    </g>

    <!-- Cánh hoa rơi lượn bên cạnh -->
    <path d="M 20,9 C 23,7 25,10 23,12 C 20,13 19,10 20,9 Z" fill="#f472b6" stroke="#9d174d" stroke-width="0.6"/>
    <path d="M 7,20 C 5,22 8,24 9,22 C 10,20 8,19 7,20 Z" fill="#fbcfe8" stroke="#db2777" stroke-width="0.6"/>
  </g>
</svg>