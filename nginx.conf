# Configuration for Nginx Load Balancer

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'to: $upstream_addr rt=$request_time uct=$upstream_connect_time';

    access_log /var/log/nginx/access.log main;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off; # Hide Nginx version for security

    # Gzip Compression
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Define the backend servers for load balancing
    upstream nextjs_backend {
        # ip_hash ensures sticky sessions (users stick to the same server, useful for socket.io/sessions)
        ip_hash;

        # List your Next.js instances (replicas) here:
        server 172.16.9.100:3000 max_fails=3 fail_timeout=30s; # Instance 1
        server 172.16.9.101:3000 max_fails=3 fail_timeout=30s; # Instance 2
        # server 172.16.9.102:3000 backup; # Backup server if all others are down

        # Keep connections alive for performance
        keepalive 32;
    }

    # Main HTTP Server (Redirect to HTTPS in production)
    server {
        listen 80;
        server_name www.pthamnihongo.site pthamnihongo.site;

        # Health check endpoint for Nginx/Railway monitoring
        location /healthz {
            access_log off;
            return 200 "healthy\n";
        }

        # Redirect all HTTP traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS Server
    server {
        listen 443 ssl;
        http2 on;
        server_name www.pthamnihongo.site pthamnihongo.site;

        # SSL Configuration (Update paths to your certificates)
        ssl_certificate /etc/letsencrypt/live/pthamnihongo.site/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/pthamnihongo.site/privkey.pem;
        
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # Proxy Next.js requests to upstream
        location / {
            proxy_pass http://nextjs_backend;
            
            # Proxy headers required for Next.js routing, headers, and HTTPS detection
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Optimize caching for Next.js static assets (_next/static)
        location /_next/static/ {
            proxy_pass http://nextjs_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            
            # Static files can be cached permanently in the browser
            expires 365d;
            access_log off;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Optimize caching for static public files (images, favicon, etc.)
        location /static/ {
            proxy_pass http://nextjs_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            
            expires 30d;
            access_log off;
            add_header Cache-Control "public, max-age=2592000, must-revalidate";
        }
    }
}
